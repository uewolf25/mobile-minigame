<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#131C3D">
<meta name="description" content="黄色に変わった瞬間にタップして反応速度を測る。">
<title>反射 — mobile-minigame</title>
<link rel="stylesheet" href="../shared/arcade.css">
<style>
:root { --accent: var(--yellow); }

.pad {
  -webkit-appearance: none;
  appearance: none;
  width: 100%;
  flex: 1 1 auto;
  min-height: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 16px;
  font: inherit;
  text-align: center;
  color: var(--paper);
  background: var(--ink-deep);
  border: var(--edge) solid var(--ink-line);
  border-radius: 0;
  cursor: pointer;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
}

.pad-word {
  font-size: clamp(34px, 13vw, 60px);
  font-weight: 800;
  line-height: 1;
}
.pad-sub {
  font-size: 14px;
  font-weight: 700;
  color: var(--mist);
}
.pad-time {
  font-size: clamp(28px, 11vw, 48px);
  font-weight: 800;
  line-height: 1;
}
.pad-time .unit { font-size: 16px; color: var(--mist); }

/* 状態ごとの版 */
.pad[data-state="wait"] {
  background: var(--orange);
  border-color: var(--orange);
  color: var(--paper);
}
.pad[data-state="wait"] .pad-sub { color: var(--ink); }

.pad[data-state="go"] {
  background: var(--yellow);
  border-color: var(--yellow);
  color: var(--ink);
}
.pad[data-state="go"] .pad-sub { color: var(--ink); }

.pad[data-state="early"] { border-color: var(--orange); }
.pad[data-state="early"] .pad-word { color: var(--orange); }

.pad[data-state="done"] { border-color: var(--yellow); }

/* 直近の記録 */
.history {
  display: flex;
  gap: 6px;
  justify-content: center;
  flex-wrap: wrap;
  flex: none;
  min-height: 26px;
  margin: 8px 0 0;
  padding: 0;
  list-style: none;
}
.history[hidden] { display: none; }
.history li {
  font-size: 13px;
  font-weight: 700;
  color: var(--paper);
  background: var(--ink-deep);
  border: 1px solid var(--ink-line);
  padding: 2px 8px;
}
.history li.is-best { color: var(--ink); background: var(--yellow); border-color: var(--yellow); }
</style>
</head>
<body>
<div class="screen">

  <header class="top">
    <a class="back" href="../" aria-label="一覧にもどる">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square" aria-hidden="true">
        <path d="M15 4 L7 12 L15 20"></path>
      </svg>
    </a>
    <h1 class="top-title"><span class="plate" data-text="反射">反射</span></h1>
    <span class="top-note">黄色でタップ</span>
  </header>

  <div class="strip">
    <div class="stat">
      <span class="stat-label">こんかい</span>
      <span class="stat-value" id="s-last">—</span>
    </div>
    <div class="stat">
      <span class="stat-label">直近5回の平均</span>
      <span class="stat-value" id="s-avg">—</span>
    </div>
    <div class="stat stat--accent">
      <span class="stat-label">最速</span>
      <span class="stat-value" id="s-best">—</span>
    </div>
  </div>

  <main class="stage" id="stage">
    <button class="pad" id="pad" type="button" data-state="idle">
      <span class="pad-word" id="word">タップで開始</span>
      <span class="pad-sub" id="sub">赤が黄色に変わったら押す</span>
    </button>
    <ul class="history" id="history"></ul>
    <p class="visually-hidden" id="live" role="status" aria-live="assertive"></p>
  </main>

  <div class="foot">
    <button class="btn" id="main" type="button">はじめる</button>
  </div>

</div>

<script>
(function () {
  'use strict';

  var KEY = 'mmg.reflex.best';

  /* localStorage は使えない端末がある。読めなくても書けなくても遊べること。 */
  function load() {
    try {
      var v = window.localStorage.getItem(KEY);
      if (v === null) { return 0; }
      var n = parseInt(v, 10);
      return isFinite(n) && n > 0 ? n : 0;
    } catch (e) { return 0; }
  }
  function save(n) {
    try { window.localStorage.setItem(KEY, String(n)); } catch (e) {}
  }

  var pad     = document.getElementById('pad');
  var mainBtn = document.getElementById('main');
  var word    = document.getElementById('word');
  var sub     = document.getElementById('sub');
  var live    = document.getElementById('live');
  var histEl  = document.getElementById('history');
  var elLast  = document.getElementById('s-last');
  var elAvg   = document.getElementById('s-avg');
  var elBest  = document.getElementById('s-best');

  var MIN_WAIT = 1200;
  var MAX_WAIT = 4200;

  var state   = 'idle';   /* idle / wait / go / done / early */
  var timer   = 0;
  var goAt    = 0;
  var best    = load();
  var recent  = [];       /* 直近の記録（新しい順） */

  function ms(n) {
    return '<span>' + n + '</span><span class="unit">ms</span>';
  }

  function render() {
    elLast.innerHTML = recent.length ? ms(recent[0]) : '—';
    if (recent.length) {
      var use = recent.slice(0, 5);
      var sum = 0;
      for (var i = 0; i < use.length; i++) { sum += use[i]; }
      elAvg.innerHTML = ms(Math.round(sum / use.length));
    } else {
      elAvg.innerHTML = '—';
    }
    elBest.innerHTML = best ? ms(best) : '—';

    histEl.innerHTML = '';
    for (var j = 0; j < Math.min(recent.length, 5); j++) {
      var li = document.createElement('li');
      li.textContent = recent[j] + 'ms';
      if (best && recent[j] === best) { li.className = 'is-best'; }
      histEl.appendChild(li);
    }
  }

  function setState(s, headline, note) {
    state = s;
    pad.setAttribute('data-state', s);
    word.innerHTML = headline;
    sub.textContent = note;
    histEl.hidden = (s === 'wait' || s === 'go');
  }

  function clearTimer() {
    if (timer) { window.clearTimeout(timer); timer = 0; }
  }

  function toIdle() {
    clearTimer();
    setState('idle', 'タップで開始', '赤が黄色に変わったら押す');
    mainBtn.textContent = 'はじめる';
  }

  function start() {
    clearTimer();
    setState('wait', 'まて', '黄色になるまで押さない');
    mainBtn.textContent = 'まて…';
    var wait = MIN_WAIT + Math.floor(Math.random() * (MAX_WAIT - MIN_WAIT + 1));
    timer = window.setTimeout(go, wait);
  }

  function go() {
    timer = 0;
    goAt = now();
    setState('go', 'いま！', 'すぐタップ');
    mainBtn.textContent = 'いま！';
    live.textContent = 'いま';
  }

  function early() {
    clearTimer();
    setState('early', 'はやい', '黄色になる前に押した。記録には残さない');
    mainBtn.textContent = 'もう一度';
    live.textContent = 'はやい。やり直し';
  }

  function hit() {
    var t = Math.round(now() - goAt);
    recent.unshift(t);
    if (recent.length > 20) { recent.pop(); }

    var isBest = (!best || t < best);
    if (isBest) { best = t; save(best); }

    setState('done', ms(t), isBest ? '最速を更新した' : 'もう一度いける');
    word.className = 'pad-time';
    mainBtn.textContent = 'もう一度';
    live.textContent = t + 'ミリ秒' + (isBest ? '。最速を更新' : '');
    render();
  }

  function now() {
    return (window.performance && window.performance.now)
      ? window.performance.now()
      : new Date().getTime();
  }

  /* 1つの入口にまとめる。パッドでも下の主ボタンでも同じ返事をする。 */
  function press() {
    if (state === 'wait') { early(); return; }
    if (state === 'go')   { hit();   return; }
    word.className = 'pad-word';
    start();
  }

  /* click は遅延が出るので pointerdown で拾う */
  pad.addEventListener('pointerdown', function (e) { e.preventDefault(); press(); });
  mainBtn.addEventListener('pointerdown', function (e) { e.preventDefault(); press(); });

  function keyPress(e) {
    if (e.key === ' ' || e.key === 'Enter' || e.key === 'Spacebar') {
      e.preventDefault();   /* button の合成 click を止める */
      press();
    }
  }
  pad.addEventListener('keydown', keyPress);
  mainBtn.addEventListener('keydown', keyPress);

  /* 画面を離れたら待機を打ち切る（戻ってきた瞬間の暴発を防ぐ） */
  document.addEventListener('visibilitychange', function () {
    if (document.hidden && (state === 'wait' || state === 'go')) { toIdle(); }
  });

  toIdle();
  render();
}());
</script>
</body>
</html>
